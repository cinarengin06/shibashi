<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>Shibashi EFE · Temel Ders</title>
    <style>
      html, body { margin: 0; width: 100%; height: 100%; background: #050908; overflow: hidden; }
      iframe { display: block; width: 100%; height: 100%; border: 0; }
    </style>
  </head>
  <body>
    <script>
      const videos = new Set(["9K2yhF0kh1g", "WmC0lMoFZnA", "eem4xQX8mfc"]);
      const id = new URLSearchParams(location.search).get("id");
      if (id && videos.has(id)) {
        const player = document.createElement("iframe");
        player.src = `https://www.youtube-nocookie.com/embed/${id}?playsinline=1&rel=0`;
        player.title = "Temel Ders · Shibashi EFE";
        player.allow = "autoplay; encrypted-media; fullscreen; picture-in-picture";
        player.allowFullscreen = true;
        player.referrerPolicy = "strict-origin-when-cross-origin";
        player.setAttribute("sandbox", "allow-scripts allow-same-origin allow-presentation");
        document.body.append(player);
      }
    </script>
  </body>
</html>
